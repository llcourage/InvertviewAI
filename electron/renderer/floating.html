<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview AI - Floating</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: rgba(102, 126, 234, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      -webkit-app-region: drag;
    }

    .title {
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .closeBtn {
      -webkit-app-region: no-drag;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .closeBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .content {
      flex: 1;
      padding: 1rem;
      color: white;
      overflow-y: auto;
    }

    .quickActions {
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    button {
      flex: 1;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Interview AI - Quick Access</div>
    <button class="closeBtn" id="closeBtn">×</button>
  </div>

  <div class="content">
    <p>This is a floating window for quick access to Interview AI features.</p>
    <p style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8;">
      You can drag this window around and use it for quick interactions.
    </p>
  </div>

  <div class="quickActions">
    <button>Quick Chat</button>
    <button>Record</button>
  </div>

  <script>
    const closeBtn = document.getElementById('closeBtn');
    closeBtn.addEventListener('click', () => {
      window.electronAPI.toggleFloatingWindow();
    });
  </script>
</body>
</html>
