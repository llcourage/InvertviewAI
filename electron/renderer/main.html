<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview AI - Main Window</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .title {
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
    }

    button {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    .chat {
      flex: 1;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 2rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .messageContent {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message.user .messageContent {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .message.assistant .messageContent {
      background: #f0f0f0;
      color: #333;
    }

    .inputArea {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      border-top: 1px solid #e0e0e0;
    }

    .input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .input:focus {
      border-color: #667eea;
    }

    .sendButton {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .sendButton:hover:not(:disabled) {
      opacity: 0.9;
    }

    .sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .usage {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Interview AI</div>
    <div class="controls">
      <button id="floatingBtn">Toggle Floating Window</button>
    </div>
  </div>

  <div class="container">
    <div class="chat">
      <div class="messages" id="messages">
        <div class="empty">Start a conversation...</div>
      </div>
      <div class="inputArea">
        <input type="text" id="input" class="input" placeholder="Type your message...">
        <button id="sendBtn" class="sendButton">Send</button>
      </div>
    </div>
    <div class="usage" id="usage">Loading usage...</div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const floatingBtn = document.getElementById('floatingBtn');
    const usageDiv = document.getElementById('usage');

    let messages = [];
    let loading = false;

    function addMessage(role, content) {
      messages.push({ role, content });
      renderMessages();
    }

    function renderMessages() {
      if (messages.length === 0) {
        messagesDiv.innerHTML = '<div class="empty">Start a conversation...</div>';
        return;
      }

      messagesDiv.innerHTML = messages.map(msg => `
        <div class="message ${msg.role}">
          <div class="messageContent">${msg.content}</div>
        </div>
      `).join('');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || loading) return;

      addMessage('user', text);
      input.value = '';
      loading = true;
      sendBtn.disabled = true;

      try {
        const response = await window.electronAPI.apiChat({
          messages: messages,
          model: 'gpt-4',
          stream: false,
        });

        const content = response.choices[0]?.message?.content || 'No response';
        addMessage('assistant', content);
      } catch (error) {
        console.error('Error:', error);
        addMessage('assistant', 'Error: Failed to get response');
      } finally {
        loading = false;
        sendBtn.disabled = false;
      }
    }

    async function loadUsage() {
      try {
        const usage = await window.electronAPI.apiUsage();
        usageDiv.textContent = `Usage: ${usage.used}/${usage.limit} (${usage.remaining} remaining)`;
      } catch (error) {
        console.error('Error loading usage:', error);
        usageDiv.textContent = 'Failed to load usage';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    floatingBtn.addEventListener('click', () => {
      window.electronAPI.toggleFloatingWindow();
    });

    loadUsage();
    setInterval(loadUsage, 60000); // Update every minute
  </script>
</body>
</html>
