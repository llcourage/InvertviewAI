<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview AI - Voice Call</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
      overflow: hidden;
    }

    .call-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    .call-status {
      text-align: center;
      margin-bottom: 2rem;
    }

    .status-text {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 0.5rem;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 0.5rem;
      animation: pulse 2s infinite;
    }

    .status-indicator.disconnected {
      background: #f44336;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .avatar-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      border: 4px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .audio-visualizer {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      height: 80px;
      display: none;
      z-index: 10;
    }

    .audio-visualizer.active {
      display: block;
    }

    .visualizer-canvas {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .avatar {
      font-size: 80px;
    }

    .avatar-container.speaking {
      border-color: #4caf50;
      box-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
      animation: speaking 1s infinite;
    }

    .avatar-container.listening {
      border-color: #2196f3;
      box-shadow: 0 0 30px rgba(33, 150, 243, 0.5);
      animation: listening 1s infinite;
    }

    @keyframes speaking {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes listening {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(33, 150, 243, 0.5); }
      50% { transform: scale(1.1); box-shadow: 0 0 50px rgba(33, 150, 243, 0.8); }
    }

    .interviewer-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .interview-type {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .controls {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .call-button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .call-button.start {
      background: #4caf50;
      color: white;
    }

    .call-button.start:hover {
      background: #45a049;
      transform: scale(1.1);
    }

    .call-button.end {
      background: #f44336;
      color: white;
    }

    .call-button.end:hover {
      background: #da190b;
      transform: scale(1.1);
    }

    .call-button.mute {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .call-button.mute:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .call-button.mute.active {
      background: #ff9800;
      border-color: #ff9800;
    }

    .transcript {
      position: absolute;
      bottom: 10rem;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 600px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      padding: 1rem;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      display: none;
    }

    .transcript.active {
      display: block;
    }

    .transcript-item {
      margin-bottom: 0.5rem;
      padding: 0.5rem;
      border-radius: 6px;
    }

    .transcript-item.user {
      background: rgba(76, 175, 80, 0.2);
      text-align: right;
    }

    .transcript-item.interviewer {
      background: rgba(33, 150, 243, 0.2);
    }

    .transcript-label {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-bottom: 0.25rem;
    }

    .header {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      z-index: 1000;
    }

    .header-button {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      z-index: 1000;
      position: relative;
    }

    .header-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    #demoBtn {
      background: rgba(76, 175, 80, 0.3);
      border-color: rgba(76, 175, 80, 0.5);
    }
    
    #demoBtn:hover {
      background: rgba(76, 175, 80, 0.5);
    }

    .device-selector {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      min-width: 200px;
    }

    .device-selector label {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .device-selector select {
      padding: 0.4rem;
      background: rgba(0, 0, 0, 0.3);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .device-selector select:hover {
      background: rgba(0, 0, 0, 0.4);
    }

    .device-selector select option {
      background: #2a5298;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="device-selector">
      <label for="micSelect">Microphone:</label>
      <select id="micSelect">
        <option value="">Loading devices...</option>
      </select>
    </div>
    <button class="header-button" id="toggleTranscript">Show Transcript</button>
    <button class="header-button" id="floatingBtn">Floating Window</button>
    <button class="header-button" id="demoBtn">Realtime Demo</button>
  </div>

  <div class="call-container">
    <div class="call-status">
      <div class="status-text">
        <span class="status-indicator" id="statusIndicator"></span>
        <span id="statusText">Ready to start interview</span>
      </div>
    </div>

    <div class="avatar-container" id="avatarContainer">
      <div class="avatar">👤</div>
    </div>

    <div class="audio-visualizer" id="audioVisualizer">
      <canvas class="visualizer-canvas" id="visualizerCanvas"></canvas>
    </div>

    <div class="interviewer-name">Interview AI</div>
    <div class="interview-type">Behavioral Question Interview</div>

    <div class="transcript" id="transcript"></div>

    <div class="controls">
      <button class="call-button mute" id="muteBtn" title="Mute/Unmute" style="display: none;">🔇</button>
      <button class="call-button start" id="callButton">📞</button>
    </div>
  </div>

  <script>
    const callButton = document.getElementById('callButton');
    const muteBtn = document.getElementById('muteBtn');
    const statusText = document.getElementById('statusText');
    const statusIndicator = document.getElementById('statusIndicator');
    const avatarContainer = document.getElementById('avatarContainer');
    const transcript = document.getElementById('transcript');
    const toggleTranscript = document.getElementById('toggleTranscript');
    const floatingBtn = document.getElementById('floatingBtn');
    const demoBtn = document.getElementById('demoBtn');
    const audioVisualizer = document.getElementById('audioVisualizer');
    const visualizerCanvas = document.getElementById('visualizerCanvas');
    const canvasCtx = visualizerCanvas.getContext('2d');
    const micSelect = document.getElementById('micSelect');

    // Set canvas size - will be updated when visualizer is activated
    function updateCanvasSize() {
      if (visualizerCanvas) {
        const rect = visualizerCanvas.getBoundingClientRect();
        visualizerCanvas.width = rect.width * window.devicePixelRatio;
        visualizerCanvas.height = rect.height * window.devicePixelRatio;
        canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
    }
    
    // Update canvas on resize
    window.addEventListener('resize', updateCanvasSize);

    let isConnected = false;
    let isMuted = false;
    let currentAudio = null;
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let dataArray = null;
    let animationFrameId = null;
    let currentStream = null;
    let audioDevices = [];
    let isSpeaking = false;
    let isProcessing = false;
    
    // Realtime API variables
    let trackProcessor = null;
    let audioStreamReader = null;
    let isAudioStreaming = false;
    
    // Audio playback queue system
    if (!window.audioPlaybackQueue) {
      window.audioPlaybackQueue = [];
      window.audioPlaybackScheduledTime = 0;
      window.audioPlaybackIsPlaying = false;
    }
    
    // Helper functions for audio processing
    function floatTo16BitPCM(input) {
      const output = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return output;
    }
    
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      const chunkSize = 0x8000; // 32KB chunks
      
      for (let i = 0; i < len; i += chunkSize) {
        binary += String.fromCharCode.apply(
          null, 
          bytes.subarray(i, Math.min(i + chunkSize, len))
        );
      }
      return window.btoa(binary);
    }
    
    function resampleAudio(input, inputSampleRate, outputSampleRate) {
      const ratio = inputSampleRate / outputSampleRate;
      const outputLength = Math.round(input.length / ratio);
      const output = new Float32Array(outputLength);
      
      for (let i = 0; i < outputLength; i++) {
        const index = i * ratio;
        const indexFloor = Math.floor(index);
        const indexCeil = Math.min(indexFloor + 1, input.length - 1);
        const fraction = index - indexFloor;
        
        output[i] = input[indexFloor] * (1 - fraction) + input[indexCeil] * fraction;
      }
      
      return output;
    }

    // Call button handler
    callButton.addEventListener('click', async () => {
      if (!isConnected) {
        await startCall();
      } else {
        await endCall();
      }
    });

    // Mute button handler
    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
      muteBtn.classList.toggle('active', isMuted);
      
      // Pause/resume audio visualization when muted
      if (isMuted && animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        canvasCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
      } else if (!isMuted && analyser && !animationFrameId) {
        visualize();
      }
    });

    // Toggle transcript
    toggleTranscript.addEventListener('click', () => {
      transcript.classList.toggle('active');
      toggleTranscript.textContent = transcript.classList.contains('active') 
        ? 'Hide Transcript' 
        : 'Show Transcript';
    });

    floatingBtn.addEventListener('click', () => {
      window.electronAPI.toggleFloatingWindow();
    });

    demoBtn.addEventListener('click', () => {
      console.log('Realtime Demo button clicked');
      try {
        window.electronAPI.openRealtimeDemo();
        console.log('openRealtimeDemo called successfully');
      } catch (error) {
        console.error('Error opening Realtime Demo:', error);
        alert('Error opening Realtime Demo: ' + error.message);
      }
    });
    
    // Check if button exists and API is available
    if (!demoBtn) {
      console.error('demoBtn not found!');
    } else {
      console.log('demoBtn found:', demoBtn);
    }
    
    if (!window.electronAPI) {
      console.error('window.electronAPI not available!');
    } else {
      console.log('window.electronAPI available');
      if (!window.electronAPI.openRealtimeDemo) {
        console.error('openRealtimeDemo method not available!');
      } else {
        console.log('openRealtimeDemo method available');
      }
    }

    // Load audio devices on page load
    window.addEventListener('load', () => {
      loadAudioDevices();
    });

    // Reload devices when selection changes (in case new devices are connected)
    micSelect.addEventListener('click', loadAudioDevices);
    micSelect.addEventListener('focus', loadAudioDevices);

    async function loadAudioDevices() {
      try {
        // Request permission first to get device labels
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          tempStream.getTracks().forEach(track => track.stop());
        } catch (permError) {
          console.log('Permission not granted yet, will request on call start');
        }
        
        const devices = await navigator.mediaDevices.enumerateDevices();
        audioDevices = devices.filter(device => device.kind === 'audioinput');
        
        // Clear existing options
        micSelect.innerHTML = '';
        
        if (audioDevices.length === 0) {
          micSelect.innerHTML = '<option value="">No microphones found</option>';
          return;
        }
        
        // Add default option
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = 'Default Microphone';
        micSelect.appendChild(defaultOption);
        
        // Add devices to select
        audioDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${index + 1}`;
          micSelect.appendChild(option);
        });
        
        // Select default if no selection
        if (!micSelect.value) {
          micSelect.value = '';
        }
      } catch (error) {
        console.error('Error loading audio devices:', error);
        micSelect.innerHTML = '<option value="">Error loading devices</option>';
      }
    }

    async function startCall() {
      // Prevent immediate execution to avoid blocking
      setTimeout(async () => {
        try {
          console.log('[DEBUG] Start call button clicked');
          
          // Prevent multiple clicks
          if (isConnected) {
            console.log('[WARN] Already connected');
            return;
          }
          
          // Disable button immediately to prevent double-click
          callButton.disabled = true;
          callButton.textContent = '📴';
          callButton.classList.remove('start');
          callButton.classList.add('end');
          muteBtn.style.display = 'block';
          statusText.textContent = 'Connecting to Realtime API...';
          statusIndicator.classList.remove('disconnected');
          
          // Check if electronAPI is available
          if (!window.electronAPI) {
            console.error('[ERROR] Electron API not available. Make sure you are running in Electron.');
            callButton.disabled = false;
            callButton.textContent = '📞';
            callButton.classList.remove('end');
            callButton.classList.add('start');
            alert('Electron API not available');
            return;
          }
          
          console.log('[DEBUG] electronAPI available, checking realtimeConnect...');
          if (!window.electronAPI.realtimeConnect) {
            console.error('[ERROR] realtimeConnect method not available');
            callButton.disabled = false;
            callButton.textContent = '📞';
            callButton.classList.remove('end');
            callButton.classList.add('start');
            alert('realtimeConnect method not available');
            return;
          }
          console.log('[DEBUG] realtimeConnect method found');
          
          // Connect to Realtime API with timeout
          console.log('[CONNECT] Establishing WebSocket connection...');
          try {
            // Use Promise.race to add timeout
            const connectPromise = window.electronAPI.realtimeConnect({});
            const timeoutPromise = new Promise((_, reject) => {
              setTimeout(() => reject(new Error('Connection timeout after 15 seconds')), 15000);
            });
            
            const result = await Promise.race([connectPromise, timeoutPromise]);
            console.log('[OK] WebSocket connection established');
            console.log('[DEBUG] Connection result:', result);
          } catch (wsError) {
            const errorMsg = wsError?.message || String(wsError);
            console.error(`[ERROR] WebSocket connection failed: ${errorMsg}`);
            callButton.disabled = false;
            callButton.textContent = '📞';
            callButton.classList.remove('end');
            callButton.classList.add('start');
            throw wsError;
          }
        
          // Set up message listener BEFORE marking as connected
          try {
            // Remove any existing listeners first
            if (window.electronAPI.removeRealtimeListener) {
              window.electronAPI.removeRealtimeListener();
            }
            
            // Add new listener with error handling wrapper
            const safeHandler = (message) => {
              try {
                handleRealtimeMessage(message);
              } catch (error) {
                console.error('[ERROR] Error in message handler:', error);
              }
            };
            
            window.electronAPI.onRealtimeMessage(safeHandler);
            console.log('[OK] Message listener registered');
          } catch (listenerError) {
            console.error(`[ERROR] Failed to register message listener: ${listenerError.message}`);
            callButton.disabled = false;
            callButton.textContent = '📞';
            callButton.classList.remove('end');
            callButton.classList.add('start');
            throw listenerError;
          }
          
          // Mark as connected FIRST, before starting audio
          isConnected = true;
          statusText.textContent = 'Connected - Ready to Chat';
          statusIndicator.classList.remove('disconnected');
          callButton.disabled = true;
          
          console.log('[OK] Connected to Realtime API');
          console.log('[LISTEN] Listening for events...');
          console.log(`[DEBUG] Connection state set: isConnected=${isConnected}`);
          
          // Enable audio streaming (now that text connection is stable)
          const ENABLE_AUDIO_STREAMING = true;
          
          if (ENABLE_AUDIO_STREAMING) {
            // Start audio streaming (using Web Audio API with MediaStreamTrackProcessor for PCM16)
            setTimeout(async () => {
              try {
                console.log('[AUDIO] Starting audio stream in 1 second...');
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                if (!isConnected) {
                  console.log('[WARN] Connection lost, skipping audio start');
                  return;
                }
                
                // Get selected device ID
                const selectedDeviceId = micSelect.value;
                let constraints;
                
                if (selectedDeviceId && selectedDeviceId !== '') {
                  constraints = {
                    audio: { 
                      deviceId: { exact: selectedDeviceId },
                      echoCancellation: true,
                      noiseSuppression: true,
                      autoGainControl: true,
                      sampleRate: 24000,
                      channelCount: 1
                    }
                  };
                } else {
                  constraints = {
                    audio: {
                      echoCancellation: true,
                      noiseSuppression: true,
                      autoGainControl: true,
                      sampleRate: 24000,
                      channelCount: 1
                    }
                  };
                }

                // Request microphone permission with selected device
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                
                statusText.textContent = 'Connected - Listening...';
                avatarContainer.classList.add('listening');
                audioVisualizer.classList.add('active');
                
                // Setup audio visualization after UI is updated
                setTimeout(() => {
                  updateCanvasSize();
                  setupAudioVisualizer(stream);
                }, 100);

                // Disable device selector during call
                micSelect.disabled = true;
                
                await startAudioStreaming();
              } catch (audioError) {
                console.error(`[WARN] Audio streaming failed: ${audioError.message}`);
                console.log('[INFO] Connection will continue without audio input');
                // Don't throw - allow connection without audio
              }
            }, 1000);
          } else {
            console.log('[INFO] Audio streaming is DISABLED for testing');
          }
          
        } catch (error) {
          console.error('[ERROR] Connection error caught:', error);
          console.error(`[ERROR] Connection error: ${error.message || String(error)}`);
          
          // Reset connection state on error
          isConnected = false;
          statusText.textContent = 'Connection Failed';
          statusIndicator.classList.add('disconnected');
          callButton.disabled = false;
          callButton.textContent = '📞';
          callButton.classList.remove('end');
          callButton.classList.add('start');
          muteBtn.style.display = 'none';
          
          alert(`Failed to start call: ${error.message || 'Unknown error'}`);
        }
      }, 100); // Small delay to prevent blocking
    }

    async function endCall() {
      isConnected = false;
      callButton.textContent = '📞';
      callButton.classList.remove('end');
      callButton.classList.add('start');
      muteBtn.style.display = 'none';
      statusText.textContent = 'Call ended';
      statusIndicator.classList.add('disconnected');
      avatarContainer.classList.remove('listening', 'speaking');
      audioVisualizer.classList.remove('active');

      // Re-enable device selector
      micSelect.disabled = false;

      // Stop audio visualization
      stopAudioVisualizer();

      // Stop audio streaming
      stopAudioStreaming();

      // Stop current audio
      stopCurrentAudio();

      // Clear audio queue
      clearAudioQueue();

      // Disconnect from Realtime API
      try {
        window.electronAPI.removeRealtimeListener();
        await window.electronAPI.realtimeDisconnect();
      } catch (error) {
        console.error('Error disconnecting from Realtime API:', error);
      }

      // Stop all tracks from current stream
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      isSpeaking = false;
      isProcessing = false;
    }

    // ========== Realtime API Functions ==========
    
    // Handle Realtime API messages (real connection) - copied from realtime-demo.html
    function handleRealtimeMessage(message) {
      try {
        // Validate message
        if (!message || typeof message !== 'object') {
          console.warn('[WARN] Invalid message received:', message);
          return;
        }
        
        console.log(`[EVENT] ${message.type || 'unknown'}`);
        
        switch (message.type) {
          // User message transcription completed
          case 'conversation.item.input_audio_transcription.completed':
            try {
              console.log('[EVENT] Received user transcription event');
              const userText = message.transcript;
              if (userText && typeof userText === 'string' && userText.trim()) {
                console.log(`[USER] User said: "${userText}"`);
                addTranscript('You', userText, 'user');
              } else {
                console.log(`[WARN] User transcription is empty or invalid. transcript:`, userText);
              }
            } catch (e) {
              console.error('[ERROR] Error processing user message:', e);
            }
            break;
            
          // Assistant message transcription completed (audio mode)
          case 'response.audio_transcript.done':
            try {
              const assistantText = message.transcript;
              if (assistantText && typeof assistantText === 'string' && assistantText.trim()) {
                console.log(`[AI] Assistant said: "${assistantText}"`);
                addTranscript('Interviewer', assistantText, 'interviewer');
              }
            } catch (e) {
              console.error('[ERROR] Error processing assistant message:', e);
            }
            break;
            
          // Assistant text response (text mode)
          case 'response.text.done':
            try {
              const assistantText = message.text;
              if (assistantText && typeof assistantText === 'string' && assistantText.trim()) {
                console.log(`[AI] Assistant replied: "${assistantText}"`);
                addTranscript('Interviewer', assistantText, 'interviewer');
              }
            } catch (e) {
              console.error('[ERROR] Error processing assistant text response:', e);
            }
            break;
            
          // Response created - AI started responding
          case 'response.created':
            console.log('[AI] Assistant started responding...');
            // Clear any previous audio queue and reset
            clearAudioQueue();
            window.audioPlaybackScheduledTime = 0;
            if (window.playbackAudioContext) {
              window.audioPlaybackScheduledTime = window.playbackAudioContext.currentTime;
            }

    // Play audio chunk from Realtime API (queued playback)
    function playAudioChunk(base64Audio) {
      try {
        console.log(`[AUDIO] playAudioChunk called with ${base64Audio ? base64Audio.length : 0} bytes`);
        
        if (!base64Audio || typeof base64Audio !== 'string') {
          console.warn('[WARN] Invalid audio data');
          return;
        }
        
        // Decode base64 to binary string
        const binaryString = atob(base64Audio);
        if (binaryString.length < 2) {
          console.warn('[WARN] Audio data too short');
          return;
        }
        
        console.log(`[AUDIO] Decoded binary string length: ${binaryString.length}`);
        
        // Convert binary string to Int16Array (PCM16)
        const audioArray = new Int16Array(binaryString.length / 2);
        const view = new DataView(new ArrayBuffer(binaryString.length));
        for (let i = 0; i < binaryString.length; i++) {
          view.setUint8(i, binaryString.charCodeAt(i));
        }
        for (let i = 0; i < audioArray.length; i++) {
          audioArray[i] = view.getInt16(i * 2, true); // little-endian
        }
        
        console.log(`[AUDIO] Converted to Int16Array: ${audioArray.length} samples`);
        
        // Convert to Float32Array (normalized to -1.0 to 1.0)
        const float32Array = new Float32Array(audioArray.length);
        for (let i = 0; i < audioArray.length; i++) {
          float32Array[i] = audioArray[i] / 32768.0;
        }
        
        console.log(`[AUDIO] Converted to Float32Array: ${float32Array.length} samples`);
        
        // Add to queue
        window.audioPlaybackQueue.push({
          data: float32Array,
          timestamp: Date.now()
        });
        
        console.log(`[AUDIO] Queued audio chunk (${float32Array.length} samples), queue length: ${window.audioPlaybackQueue.length}, isPlaying: ${window.audioPlaybackIsPlaying}`);
        
        // Start playback if not already playing
        if (!window.audioPlaybackIsPlaying) {
          console.log('[AUDIO] Starting playback queue');
          processAudioQueue();
        } else {
          console.log('[AUDIO] Playback already in progress, chunk will be played when queue processes it');
        }
      } catch (error) {
        console.error('[ERROR] Error queuing audio:', error);
        console.error('[ERROR] Error stack:', error.stack);
      }
    }
    
    // Process audio queue sequentially
    async function processAudioQueue() {
      if (window.audioPlaybackQueue.length === 0) {
        window.audioPlaybackIsPlaying = false;
        console.log('[AUDIO] Queue empty, stopping playback');
        return;
      }
      
      window.audioPlaybackIsPlaying = true;
      console.log(`[AUDIO] Processing queue, ${window.audioPlaybackQueue.length} chunks remaining`);
      
      // Create or reuse AudioContext for playback (separate from input)
      if (!window.playbackAudioContext) {
        console.log('[AUDIO] Creating new playback AudioContext');
        window.playbackAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      }
      
      const playbackCtx = window.playbackAudioContext;
      console.log(`[AUDIO] Playback AudioContext state: ${playbackCtx.state}, sampleRate: ${playbackCtx.sampleRate}`);
      
      // Resume if suspended
      if (playbackCtx.state === 'suspended') {
        console.log('[AUDIO] Resuming suspended playback context...');
        await playbackCtx.resume().catch(err => {
          console.error('[ERROR] Failed to resume playback context:', err);
        });
        console.log(`[AUDIO] Playback AudioContext state after resume: ${playbackCtx.state}`);
      }
      
      if (playbackCtx.state === 'closed') {
        console.log('[AUDIO] Playback context was closed, creating new one');
        window.playbackAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      }
      
      // Create or reuse GainNode to control volume (reduce echo)
      if (!window.playbackGainNode) {
        console.log('[AUDIO] Creating GainNode for playback');
        window.playbackGainNode = playbackCtx.createGain();
        window.playbackGainNode.gain.value = 0.7; // Reduce volume to 70% to minimize echo
        window.playbackGainNode.connect(playbackCtx.destination);
        console.log('[AUDIO] GainNode created and connected to destination');
      }
      
      // Get next chunk from queue
      const chunk = window.audioPlaybackQueue.shift();
      if (!chunk) {
        window.audioPlaybackIsPlaying = false;
        console.log('[AUDIO] No chunk available, stopping');
        return;
      }
      
      // Calculate duration of this chunk
      const sampleRate = 24000;
      const duration = chunk.data.length / sampleRate;
      
      // Schedule playback
      const currentTime = playbackCtx.currentTime;
      const startTime = Math.max(currentTime, window.audioPlaybackScheduledTime);
      
      console.log(`[AUDIO] Preparing to play chunk: ${chunk.data.length} samples, duration: ${duration.toFixed(3)}s, startTime: ${startTime.toFixed(3)}`);
      
      // Create AudioBuffer and play
      try {
        const audioBuffer = playbackCtx.createBuffer(1, chunk.data.length, sampleRate);
        audioBuffer.getChannelData(0).set(chunk.data);
        
        const source = playbackCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(window.playbackGainNode);
        
        // Add error handler
        source.onended = () => {
          console.log(`[AUDIO] Audio chunk finished playing`);
        };
        
        source.onerror = (error) => {
          console.error('[ERROR] Audio source error:', error);
        };
        
        source.start(startTime);
        console.log(`[AUDIO] Audio source started at ${startTime.toFixed(3)}`);
        
        // Update scheduled time for next chunk
        window.audioPlaybackScheduledTime = startTime + duration;
        
        console.log(`[AUDIO] Playing audio chunk (${chunk.data.length} samples, ${duration.toFixed(3)}s) at time ${startTime.toFixed(3)}`);
        
        // Schedule next chunk
        setTimeout(() => {
          processAudioQueue();
        }, duration * 1000 - 10); // Process next chunk slightly before current ends
      } catch (error) {
        console.error('[ERROR] Failed to create or play audio buffer:', error);
        console.error('[ERROR] Error stack:', error.stack);
        // Continue processing queue even if this chunk fails
        setTimeout(() => {
          processAudioQueue();
        }, 100);
      }
    }

              console.log('🔇 Silence threshold reached (', SILENCE_THRESHOLD, 'ms), stopping recording. Total duration:', recordingDuration, 'ms');
              currentRecorder.stop();
            } else {
              console.log('⏳ Recording too short (', recordingDuration, 'ms), waiting for minimum duration (', MIN_RECORDING_DURATION, 'ms)');
              // Reset timer to check again after minimum duration
              resetSilenceTimer();
            }
          }
        }, SILENCE_THRESHOLD);
      }

      function checkAudioAndRecord() {
        if (!isConnected || isMuted) {
          requestAnimationFrame(checkAudioAndRecord);
          return;
        }
        
        // Don't record if AI is speaking or if we're processing a request
        if (isSpeaking || isProcessing) {
          requestAnimationFrame(checkAudioAndRecord);
          return;
        }

        analyser.getByteFrequencyData(dataArray);
        const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
        const volume = average / 255;

        const now = Date.now();

        // Start recording if user is speaking and not already recording
        if (volume > 0.15 && !isCurrentlyRecording) {
          console.log('🎤 Speech detected! Volume:', volume.toFixed(2), '| isSpeaking:', isSpeaking, '| isConnected:', isConnected, '| isMuted:', isMuted, '| isCurrentlyRecording:', isCurrentlyRecording);
          console.log('🎤 Starting new recording...');
          isCurrentlyRecording = true;
          recordingStartTime = now;
          lastSpeechTime = now;
          recordingChunks = [];
          
          // Clear any existing timer
          if (silenceTimer) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
          }
          
          try {
            currentRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

            currentRecorder.ondataavailable = (event) => {
              if (event.data && event.data.size > 0) {
                recordingChunks.push(event.data);
              }
            };

            currentRecorder.onstop = async () => {
              console.log('⏹️ Recording stopped. Chunks:', recordingChunks.length, '| isCurrentlyRecording:', isCurrentlyRecording);
              
              // Clear silence timer
              if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
              }
              
              // IMPORTANT: Reset recording state immediately so next recording can start
              const chunksToProcess = [...recordingChunks]; // Copy chunks before clearing
              isCurrentlyRecording = false;
              recordingStartTime = null;
              lastSpeechTime = null;
              recordingChunks = []; // Clear immediately
              silenceConfirmationCount = 0; // Reset silence confirmation counter
              
              console.log('✅ Recording state reset. Ready for next recording.');
              
              if (chunksToProcess.length > 0) {
                const audioBlob = new Blob(chunksToProcess, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = async () => {
                  const base64Audio = reader.result.split(',')[1];
                  console.log('📤 Sending audio to Whisper API, size:', base64Audio.length);
                  await processUserAudio(base64Audio);
                };
                reader.readAsDataURL(audioBlob);
              } else {
                console.log('⚠️ No audio chunks recorded, resetting to listening state');
                avatarContainer.classList.add('listening');
                statusText.textContent = 'Connected - Listening...';
              }
            };

            currentRecorder.onerror = (event) => {
              console.error('MediaRecorder error:', event.error);
              isCurrentlyRecording = false;
              if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
              }
              recordingStartTime = null;
              lastSpeechTime = null;
              recordingChunks = [];
            };

            currentRecorder.start(100); // Collect data every 100ms
            resetSilenceTimer();
          } catch (e) {
            console.error('Failed to start MediaRecorder:', e);
            isCurrentlyRecording = false;
          }
        }
        // Update silence timer if user is still speaking
        else if (volume > 0.15 && isCurrentlyRecording) {
          lastSpeechTime = now;
          silenceConfirmationCount = 0; // Reset silence confirmation on speech
          resetSilenceTimer(); // Reset timer on continued speech
        }
        // Check if we should stop (silence detected) - but only if we've recorded for minimum duration
        else if (volume <= 0.05 && isCurrentlyRecording && lastSpeechTime && recordingStartTime) {
          const silenceDuration = now - lastSpeechTime;
          const recordingDuration = now - recordingStartTime;
          
          // Increment silence confirmation counter
          silenceConfirmationCount++;
          
          // Only stop if all conditions are met:
          // 1. Silence duration exceeds threshold
          // 2. Total recording duration exceeds minimum
          // 3. Multiple consecutive silence confirmations (to avoid false stops during natural pauses)
          if (silenceDuration >= SILENCE_THRESHOLD && 
              recordingDuration >= MIN_RECORDING_DURATION && 
              silenceConfirmationCount >= SILENCE_CONFIRMATION_COUNT) {
            console.log('🔇 Silence confirmed (', silenceConfirmationCount, 'times), duration:', silenceDuration, 'ms, total recording:', recordingDuration, 'ms, stopping recording');
            if (currentRecorder && currentRecorder.state === 'recording') {
              currentRecorder.stop();
            }
          } else if (silenceDuration >= SILENCE_THRESHOLD && recordingDuration < MIN_RECORDING_DURATION) {
            console.log('⏳ Silence detected but recording too short (', recordingDuration, 'ms < ', MIN_RECORDING_DURATION, 'ms), continuing...');
            silenceConfirmationCount = 0; // Reset counter if too short
          } else if (silenceDuration >= SILENCE_THRESHOLD && silenceConfirmationCount < SILENCE_CONFIRMATION_COUNT) {
            console.log('⏳ Silence detected but not confirmed yet (', silenceConfirmationCount, '/', SILENCE_CONFIRMATION_COUNT, '), continuing...');
          }
        }
        // Debug: Log if we're not recording but should be (for troubleshooting)
        else if (volume > 0.15 && !isCurrentlyRecording && !isSpeaking) {
          // This should not happen often, but log it for debugging
          // console.log('🔍 High volume detected but not recording. Volume:', volume.toFixed(2), 'isCurrentlyRecording:', isCurrentlyRecording, 'isSpeaking:', isSpeaking);
        }

        requestAnimationFrame(checkAudioAndRecord);
      }

      checkAudioAndRecord();
    }

    function startPeriodicRecording(stream) {
      // Fallback method - record periodically
      const recordInterval = setInterval(async () => {
        if (!isConnected || isMuted) return;

        if (!isRecording) {
          isRecording = true;
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

          mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            if (audioChunks.length > 0) {
              const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
              const reader = new FileReader();
              reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];
                await processUserAudio(base64Audio);
              };
              reader.readAsDataURL(audioBlob);
            }
            isRecording = false;
          };

          mediaRecorder.start();
          setTimeout(() => {
            if (mediaRecorder && isRecording) {
              mediaRecorder.stop();
            }
          }, 3000); // Record for 3 seconds
        }
      }, 4000); // Check every 4 seconds
    }

    async function processUserAudio(base64Audio) {
      // Prevent concurrent processing
      if (isProcessing) {
        console.log('⚠️ Already processing audio, ignoring new request');
        return;
      }

      try {
        isProcessing = true;
        console.log('🔄 Processing user audio...');
        avatarContainer.classList.remove('listening');
        statusText.textContent = 'Processing...';

        const sttResponse = await window.electronAPI.apiSpeech({
          audio: base64Audio,
          model: 'whisper-1',
        });

        const userText = sttResponse.text;
        console.log('📝 Whisper transcription:', userText);
        
        if (userText && userText.trim()) {
          addTranscript('You', userText, 'user');
          console.log('💬 Sending to interview API...');
          await sendInterviewMessage(userText);
          console.log('✅ Interview message sent, waiting for response...');
        } else {
          console.log('⚠️ Empty transcription, returning to listening state');
          avatarContainer.classList.add('listening');
          statusText.textContent = 'Connected - Listening...';
        }
      } catch (error) {
        console.error('❌ Error processing audio:', error);
        avatarContainer.classList.add('listening');
        statusText.textContent = 'Connected - Listening...';
      } finally {
        isProcessing = false;
      }
    }

    async function processUserSpeech(text) {
      if (!text || !text.trim()) {
        console.log('Empty text, skipping process');
        return;
      }

      console.log('Processing user speech:', text);

      // Stop any current audio playback (user is speaking)
      if (isSpeaking) {
        console.log('Stopping current audio playback');
        stopCurrentAudio();
      }

      avatarContainer.classList.remove('listening');
      statusText.textContent = 'Processing...';

      addTranscript('You', text, 'user');
      await sendInterviewMessage(text);
    }

    async function sendInitialMessage() {
      try {
        let assistantText = '';
        let transcriptItem = null;

        // Set up streaming listener
        window.electronAPI.onInterviewStreamChunk((data) => {
          const { content, fullText } = data;
          
          // Update transcript in real-time
          if (!transcriptItem) {
            transcriptItem = addTranscript('Interviewer', '', 'interviewer');
          }
          
          // Update the transcript content
          if (transcriptItem) {
            transcriptItem.querySelector('.transcript-content').textContent = fullText;
          }
          
          assistantText = fullText;
          console.log('📡 Stream chunk received (initial), current text length:', fullText.length);
        });

        // Send empty messages array for first message - ChatGPT will generate welcome
        const response = await window.electronAPI.apiInterview({
          messages: [],
          interviewType: 'bq',
          isFirstMessage: true,
        });

        // Remove stream listener
        window.electronAPI.removeInterviewStreamListener();

        assistantText = response.choices[0]?.message?.content || '';
        if (assistantText) {
          conversationHistory.push({ role: 'assistant', content: assistantText });
          
          // Update transcript with final text if not already updated
          if (!transcriptItem) {
            addTranscript('Interviewer', assistantText, 'interviewer');
          }
          
          await playTTS(assistantText);
        }

        avatarContainer.classList.add('listening');
        statusText.textContent = 'Connected - Listening...';
      } catch (error) {
        console.error('Error sending initial message:', error);
        window.electronAPI.removeInterviewStreamListener(); // Clean up listener
        const errorMessage = error.message || 'Unknown error';
        statusText.textContent = 'Connection Error';
        alert(`Failed to connect to API server.\n\n${errorMessage}\n\nPlease make sure the API server is running:\n1. Open a terminal\n2. Run: cd website && npm run dev\n3. Wait for "Ready" message\n4. Try again`);
        await endCall();
      }
    }

    async function sendInterviewMessage(userText) {
      // Prevent concurrent requests
      if (isProcessing || isSpeaking) {
        console.log('⚠️ Already processing or speaking, ignoring new request');
        return;
      }

      try {
        isProcessing = true;
        console.log('Sending interview message:', userText);
        // Add user message to conversation history
        conversationHistory.push({ role: 'user', content: userText });

        let assistantText = '';
        let transcriptItem = null;
        let streamListenerSet = false;

        // Set up streaming listener (only once)
        if (!streamListenerSet) {
          window.electronAPI.onInterviewStreamChunk((data) => {
            const { content, fullText } = data;
            
            // Update transcript in real-time
            if (!transcriptItem) {
              transcriptItem = addTranscript('Interviewer', '', 'interviewer');
            }
            
            // Update the transcript content
            if (transcriptItem) {
              const contentEl = transcriptItem.querySelector('.transcript-content');
              if (contentEl) {
                contentEl.textContent = fullText;
              }
            }
            
            assistantText = fullText;
            console.log('📡 Stream chunk received, current text length:', fullText.length);
          });
          streamListenerSet = true;
        }

        // Send full conversation history to maintain context
        const response = await window.electronAPI.apiInterview({
          messages: conversationHistory,
          interviewType: 'bq',
          isFirstMessage: false,
        });

        // Remove stream listener
        window.electronAPI.removeInterviewStreamListener();
        streamListenerSet = false;

        assistantText = response.choices[0]?.message?.content || '';
        console.log('✅ Received complete assistant response, length:', assistantText.length);
        
        if (assistantText) {
          // Add assistant response to conversation history
          conversationHistory.push({ role: 'assistant', content: assistantText });
          
          // Update transcript with final text if not already updated
          if (!transcriptItem) {
            addTranscript('Interviewer', assistantText, 'interviewer');
          }
          
          // Play TTS - this will set isSpeaking flag
          console.log('🎵 Playing TTS, setting isSpeaking to true');
          await playTTS(assistantText);
          console.log('✅ TTS playback completed, isSpeaking should be false now');
        } else {
          console.warn('⚠️ No assistant response received');
          avatarContainer.classList.add('listening');
          statusText.textContent = 'Connected - Listening...';
        }
      } catch (error) {
        console.error('❌ Error sending message:', error);
        window.electronAPI.removeInterviewStreamListener(); // Clean up listener
        isSpeaking = false; // Ensure isSpeaking is reset on error
        avatarContainer.classList.add('listening');
        statusText.textContent = 'Connected - Listening...';
      } finally {
        isProcessing = false;
      }
    }

    function stopCurrentAudio() {
      if (currentAudio) {
        console.log('🛑 Stopping current audio playback');
        try {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          // Remove all event listeners to prevent conflicts
          currentAudio.onended = null;
          currentAudio.onerror = null;
          currentAudio.onpause = null;
          if (currentAudio.src) {
            URL.revokeObjectURL(currentAudio.src);
          }
        } catch (e) {
          console.error('Error stopping audio:', e);
        }
        currentAudio = null;
      }
      isSpeaking = false;
      avatarContainer.classList.remove('speaking');
      avatarContainer.classList.add('listening');
      statusText.textContent = 'Connected - Listening...';
    }

    async function playTTS(text) {
      // Prevent concurrent TTS playback
      if (isSpeaking) {
        console.log('⚠️ Already playing TTS, stopping current and starting new');
        stopCurrentAudio();
        await new Promise(resolve => setTimeout(resolve, 100));
      }

      try {
        // CRITICAL: Stop any currently playing audio before starting new one
        console.log('🛑 Stopping any existing audio before playing new TTS');
        stopCurrentAudio();
        
        // Wait a brief moment to ensure audio is fully stopped
        await new Promise(resolve => setTimeout(resolve, 100));

        // Double-check that no audio is playing
        if (currentAudio) {
          console.warn('⚠️ Audio still exists after stop, forcing cleanup');
          stopCurrentAudio();
        }

        avatarContainer.classList.remove('listening');
        avatarContainer.classList.add('speaking');
        statusText.textContent = 'Interviewer speaking...';
        isSpeaking = true;

        const ttsResponse = await window.electronAPI.apiTts({
          text: text,
          model: 'tts-1',
          voice: 'alloy',
          speed: 1.0,
        });

        const audioData = atob(ttsResponse.audio);
        const audioArray = new Uint8Array(audioData.length);
        for (let i = 0; i < audioData.length; i++) {
          audioArray[i] = audioData.charCodeAt(i);
        }
        const blob = new Blob([audioArray], { type: 'audio/mpeg' });
        const audioUrl = URL.createObjectURL(blob);
        currentAudio = new Audio(audioUrl);

        // Check for interruption during playback
        const checkInterruption = () => {
          if (!currentAudio || !isSpeaking) return;
          
          // Check if user is speaking (via analyser if available)
          if (analyser && dataArray) {
            analyser.getByteFrequencyData(dataArray);
            const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
            const volume = average / 255;
            
            if (volume > 0.15) {
              // User is speaking, interrupt playback
              console.log('Interruption detected during playback');
              stopCurrentAudio();
              return;
            }
          }
          
          requestAnimationFrame(checkInterruption);
        };
        
        checkInterruption();

        await new Promise((resolve, reject) => {
          if (!currentAudio) {
            resolve();
            return;
          }

          currentAudio.onended = () => {
            console.log('Audio playback ended, resetting isSpeaking to false');
            if (currentAudio && currentAudio.src) {
              URL.revokeObjectURL(currentAudio.src);
            }
            currentAudio = null;
            isSpeaking = false;
            avatarContainer.classList.remove('speaking');
            avatarContainer.classList.add('listening');
            statusText.textContent = 'Connected - Listening...';
            console.log('Ready to listen for next user input. isSpeaking:', isSpeaking, 'isConnected:', isConnected);
            resolve();
          };
          currentAudio.onerror = (error) => {
            console.error('Audio playback error:', error);
            isSpeaking = false;
            avatarContainer.classList.remove('speaking');
            avatarContainer.classList.add('listening');
            reject(error);
          };
          currentAudio.onpause = () => {
            // Audio was paused (likely interrupted)
            isSpeaking = false;
          };
          currentAudio.play().catch(reject);
        });
      } catch (error) {
        console.error('TTS error:', error);
        isSpeaking = false;
        avatarContainer.classList.remove('speaking');
        avatarContainer.classList.add('listening');
      }
    }

    function addTranscript(speaker, text, type) {
      const item = document.createElement('div');
      item.className = `transcript-item ${type}`;
      item.innerHTML = `
        <div class="transcript-label">${speaker}</div>
        <div class="transcript-content">${text}</div>
      `;
      transcript.appendChild(item);
      transcript.scrollTop = transcript.scrollHeight;
      return item; // Return item so it can be updated
    }

    // Audio visualization functions
    function setupAudioVisualizer(stream) {
      try {
        // Close existing context if any
        if (audioContext) {
          audioContext.close();
        }
        
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.8;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        microphone.connect(analyser);
        
        // Update canvas size
        visualizerCanvas.width = visualizerCanvas.offsetWidth * window.devicePixelRatio;
        visualizerCanvas.height = visualizerCanvas.offsetHeight * window.devicePixelRatio;
        canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        // Start visualization
        visualize();
      } catch (error) {
        console.error('Error setting up audio visualizer:', error);
      }
    }

    function stopAudioVisualizer() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      
      if (microphone) {
        microphone.disconnect();
        microphone = null;
      }
      
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      
      analyser = null;
      dataArray = null;
      
      // Clear canvas
      canvasCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
    }

    function visualize() {
      if (!isConnected || !analyser || !dataArray || isMuted) {
        if (isConnected && !isMuted) {
          animationFrameId = requestAnimationFrame(visualize);
        }
        return;
      }

      animationFrameId = requestAnimationFrame(visualize);

      analyser.getByteFrequencyData(dataArray);

      const width = visualizerCanvas.offsetWidth;
      const height = visualizerCanvas.offsetHeight;
      
      // Clear canvas
      canvasCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
      canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      canvasCtx.fillRect(0, 0, width, height);

      const barCount = 60;
      const barWidth = width / barCount;
      let x = 0;

      // Calculate average volume for overall visualization
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const average = sum / dataArray.length;
      const volume = average / 255;

      // Draw waveform bars
      for (let i = 0; i < barCount; i++) {
        const dataIndex = Math.floor((i / barCount) * dataArray.length);
        const barHeight = Math.max(2, (dataArray[dataIndex] / 255) * height * 0.9);

        // Create gradient based on volume
        let gradient;
        if (volume > 0.3) {
          // High volume - green to yellow
          gradient = canvasCtx.createLinearGradient(x, height, x, height - barHeight);
          gradient.addColorStop(0, '#4caf50');
          gradient.addColorStop(0.5, '#8bc34a');
          gradient.addColorStop(1, '#ffeb3b');
        } else if (volume > 0.1) {
          // Medium volume - blue
          gradient = canvasCtx.createLinearGradient(x, height, x, height - barHeight);
          gradient.addColorStop(0, '#2196f3');
          gradient.addColorStop(1, '#64b5f6');
        } else {
          // Low volume - gray
          gradient = canvasCtx.createLinearGradient(x, height, x, height - barHeight);
          gradient.addColorStop(0, '#757575');
          gradient.addColorStop(1, '#bdbdbd');
        }

        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, height - barHeight, Math.max(1, barWidth - 2), barHeight);

        x += barWidth;
      }

      // Draw center line for symmetry (waveform effect)
      const centerY = height / 2;
      const centerBarHeight = Math.max(2, volume * height * 0.4);
      
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      canvasCtx.fillRect(width / 2 - 1, centerY - centerBarHeight / 2, 2, centerBarHeight);
    }
